l_english:
 #BG3
  volos_eye_name:0 "Volo's Ersatz Eye"
  volos_eye_description:0 "While the ersatz eye is embedded in your eye socket, you can see through the tiny orb as though it were a normal eye. Can't be removed once inserted. A hollow bead of white glass, carefully painted to resemble a realistic eye. Its tarnished brass fittings hum with a tinge of magic."
  painting_PortraitoftheRedPrince_name:0 "Portrait of the Red Prince" 
  painting_PortraitoftheRedPrince_description: "This painting is awash with bold scarlet hues depicting a noble lizard. His snout is raised in a snooty, imperious glare."

 #AGOT
  dragon_egg_name: "Dragon Egg"
  dragon_egg_description:0 "A petrified dragon egg. The ages have turned it to stone, yet it still burns bright with beauty."

 rosetta_stone_name: "Rosetta Stone"
 rosetta_stone_description: "A dark granodiorite slab inscribed with a single decree in three different scripts that allowed scholars to decode ancient Egyptian hieroglyphs."
 
 joyeuse_replica_name:0 "Joyeuse Replica"
 joyeuse_replica_description:1 "A Replica of the Sword of Charlemagne, forged to be an exact copy. Joyeuse is a symbol both of knightly valor and the royal legacy of Charlemagne's empire."
 goujian_replica_name: "Replica Sword of Gujian"
 goujian_replica_desc: "A Replica of the ancient sword is said to have once belonged to the King of Yue, Goujian. While old fashioned in its design the sword shows excellent craftsmanship. Gilded text in bird-worm seal script is visible near the hilt."
 artifact_radzig_kobyla_longsword_name:0 "Radzig Kobyla's Longsword"
 
 ea_nasir_tablet_name: "Complaint tablet to Ea-nāṣir"
 ea_nasir_tablet_desc: "The complaint tablet to Ea-nāṣir is a clay tablet that was sent to the ancient city-state Ur, written c.1750 BC. documents a transaction in which Ea-nāṣir, a trader, allegedly sold sub-standard copper to a customer named Nanni. Nanni, dissatisfied with the quality, wrote a cuneiform complaint addressing the poor service and mistreatment of his servant."

 #Thief
  hammerite_holy_symbol_name: "The holy hammer"
  hammerite_holy_symbol_desc: "The holy symbol is a red and gold hammer that is kept in the possession of the high priest in the Hammer Temple."
  hammerite_forge_child_name: "The Forge's Child"
  hammerite_forge_child_desc: "The Forge's Child is an Ancient Hammer and the first to be cast out of a mold. It was created by Tennor, who would be sainted for his creation."
  hammerite_first_hammer_name: "The First Hammer"
  hammerite_first_hammer_desc: "The First Hammer is a prehistoric Stone Hammer on display at the Hammer Temple. It is a symbol of the Hammers ascent from The Tricksters shadow."
  hammerite_prayer_book_name: "Prayer Book"
  hammerite_prayer_book_desc: "The Hammerite Prayer Book is a text that can be found in St. Vale's library. Prayer of Consecration. O Master Builder! We ask Thee to bless our brother who hath died in Thy service. Forgive him the transgressions of his living days, and look with favor on his works in Thy name. Plumb and plane, fire and forge, purify his spirit and draw from him all which does not meet Thy plan. Take him to serve with Thee in Thy Home where he may rest in peace eternal."
  
  keeper_medallion_name: "Keeper Medallion"
  keeper_medallion_desc: "The Keeper medallion appears to be a copper medallion with the Keeper emblem on a copper chain"
  Bookofash_name:0 "The Book of Ash"
  Bookofash_description:0 "The Book of Ash was an ancient book of mysterious and dark power. Long ago the study of this magical tome drove many into madness. Over time, the book was eventually lost, but Azaran the Cruel, then of the Hand Brotherhood, undertook a search for the book to aid him in his studies of necromancy. He was successful in locating it in the sands of long forgotten kings and plumbed its depths."
 #FROMSOFT DARK SOULS ELDEN RING 
  WP_A_0203_name:0 "Banished Knight's Greatsword"
  WP_A_0203_description:0 "A finely-crafted greatsword intricately engraved with an ancient motif. Given to knights who, whether by misfortune or misdeed, were forced to abandon their homes. Most of these knights were sent to the fringes, where they were forced to start anew with only despair for company."
  WP_A_0207_name:0 "Lordsworn's Straight Sword"
  WP_A_0207_description:0 "Well-crafted straight sword with an illustrious design, wielded by regulars of a lord's army."
  WP_A_0211_name:0 "Noble's Slender Sword"
  WP_A_0211_description:0 "Narrow blade carried by wandering nobles. Made to be easy to wield. Daubed with gold from tip to tail, it should fetch a good sum."
  WP_A_0215_name:0 "Ornamental Straight Sword"
  WP_A_0215_description:0 "Slender straight sword patterned after an antique ornament. Superior swordsmen prefer to wield one in each hand. After falling from grace, the dregs of the golden lineage sought power and purpose in the past."\ 
  WP_A_0227_name:0 "Carian Knight's Sword"
  WP_A_0227_description:0 "Straight sword embedded with a blue glintstone. Weapon of knights sworn to Carian royalty. These knights' swords could serve as catalysts, letting them wield sorcerous battle skills. Despite numbering fewer than twenty, this power made them a match for even the champions of gold in battle."
  WP_A_0229_name:0 "Miquellan Knight's Sword"
  WP_A_0229_description:0 "Sword forged by servants of Miquella of the Haligtree, with a design modeled after those carried by Carian knights. Instead of glintstone however, amber from the Haligtree is embedded in the blade."
  WP_A_0230_name:0 "Sword of St Trina"
  WP_A_0230_description:0 "Silver sword carried by clerics of St. Trina. St. Trina is an enigmatic figure. Some say she is a comely young girl, others are sure he is a boy. The only certainty is that their appearance was as sudden as their disappearance."
  WP_A_0251_name:0 "Rogier's Rapier"
  WP_A_0251_description:0 "Piercing sword of superior quality, featuring intricate ornamentation. Signature weapon of the sorcerer Rogier. High dexterity is required to wield the blade to its full potential, but mastery is a sight to behold, characterized by a flowing style which excels in successive attacks."
  WP_A_0607_name:0 "Lordsworn's Greatsword"
  WP_A_0607_description:0 "Well-crafted straight sword with an illustrious design, wielded by regulars of a lord's army."
  WP_A_0609_name:0 "Knight's Greatsword"
  WP_A_0609_description:0 "Greatsword bestowed upon skilled swordsmen in the demigods' service, and yet had no rank or title. Featuring a long grip enabling a dual-handed use, this weapon was designed to dispatch larger foes. Being charged with such a duty was undoubtedly a great honor."
  WP_A_0617_name:0 "Dark Moon Greatsword"
  WP_A_0617_description:0 "A Moon Greatsword, bestowed by a Carian queen upon her spouse to honor long-standing tradition."
  WP_A_0626_name:0 "Grafted Blade Greatsword"
  WP_A_0626_description:0 "The storied sword of Castle Morne. A revenger's weapon, it is burdened with oceans of anger and regret. A lone surviving champion from a country now vanished was so determined to continue fighting that he claimed the swords of an entire clan of warriors."
 


